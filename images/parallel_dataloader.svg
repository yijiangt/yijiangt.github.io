<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1d4c"/>
      <stop offset="1" stop-color="#3c2c62"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e42a6"/>
      <stop offset="1" stop-color="#b74e91"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- thread lanes -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="2">
    <line x1="110" y1="185" x2="760" y2="185"/>
    <line x1="110" y1="310" x2="760" y2="310"/>
    <line x1="110" y1="435" x2="760" y2="435"/>
    <line x1="110" y1="560" x2="760" y2="560"/>
  </g>

  <!-- samples flowing along lanes (varying sizes = varying cost) -->
  <g fill="url(#accent)">
    <rect x="150" y="160" width="70" height="50" rx="8" opacity="0.55"/>
    <rect x="260" y="160" width="130" height="50" rx="8" opacity="0.75"/>
    <rect x="430" y="160" width="60" height="50" rx="8"/>
    <rect x="530" y="160" width="90" height="50" rx="8"/>

    <rect x="150" y="285" width="110" height="50" rx="8" opacity="0.55"/>
    <rect x="300" y="285" width="60" height="50" rx="8" opacity="0.75"/>
    <rect x="400" y="285" width="160" height="50" rx="8"/>
    <rect x="600" y="285" width="60" height="50" rx="8"/>

    <rect x="150" y="410" width="60" height="50" rx="8" opacity="0.55"/>
    <rect x="250" y="410" width="80" height="50" rx="8" opacity="0.75"/>
    <rect x="370" y="410" width="70" height="50" rx="8"/>
    <rect x="480" y="410" width="120" height="50" rx="8"/>

    <rect x="150" y="535" width="90" height="50" rx="8" opacity="0.55"/>
    <rect x="280" y="535" width="140" height="50" rx="8" opacity="0.75"/>
    <rect x="460" y="535" width="60" height="50" rx="8"/>
    <rect x="560" y="535" width="80" height="50" rx="8"/>
  </g>

  <!-- steal arrow between lanes -->
  <path d="M 700 330 C 740 360, 740 390, 700 415" fill="none" stroke="#e8e288" stroke-width="4" stroke-linecap="round"/>
  <path d="M 712 404 L 700 418 L 690 402" fill="none" stroke="#e8e288" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrows into batch -->
  <g stroke="rgba(255,255,255,0.35)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 780 185 C 840 185, 840 300, 880 330"/>
    <path d="M 780 310 C 830 310, 840 340, 880 350"/>
    <path d="M 780 435 C 830 435, 840 410, 880 400"/>
    <path d="M 780 560 C 840 560, 840 450, 880 420"/>
  </g>

  <!-- batch tensor grid -->
  <g transform="translate(900 250)">
    <rect x="-14" y="-14" width="228" height="278" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <g fill="url(#accent)">
      <rect x="0" y="0" width="92" height="52" rx="6"/>
      <rect x="108" y="0" width="92" height="52" rx="6"/>
      <rect x="0" y="62" width="92" height="52" rx="6"/>
      <rect x="108" y="62" width="92" height="52" rx="6" opacity="0.8"/>
      <rect x="0" y="124" width="92" height="52" rx="6" opacity="0.8"/>
      <rect x="108" y="124" width="92" height="52" rx="6" opacity="0.6"/>
    </g>
    <rect x="0" y="186" width="92" height="52" rx="6" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="108" y="186" width="92" height="52" rx="6" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
